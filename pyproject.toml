[project]
name = "bancsynk"
version = "0.1.0"
description = "Gateway bancario transversal da plataforma RLogix"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-httpserver>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
